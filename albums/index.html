<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundry #50 · Albums</title>
<style>
:root{--bg:#faf8f5;--fg:#1c1a17;--mut:#7a746b;--card:#fff;--line:#e7e2da;--acc:#e5391f;--up:#1a8f4c;--dn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14130f;--fg:#f2efe9;--mut:#9a948a;--card:#1d1b17;--line:#2e2b25;--acc:#ff6a4d;--up:#4cc784;--dn:#ff9a62}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14130f;--fg:#f2efe9;--mut:#9a948a;--card:#1d1b17;--line:#2e2b25;--acc:#ff6a4d;--up:#4cc784;--dn:#ff9a62}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}h1 span{color:var(--acc)}
.nav{font-size:13px;margin:6px 0 0;color:var(--mut)}.nav a{color:var(--mut)}.nav b{color:var(--fg)}
.sub{color:var(--mut);font-size:13px;margin:4px 0 18px}
.row{display:grid;grid-template-columns:46px 36px 48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.rk{text-align:center;line-height:1.1}
.rk b{display:block;font-size:20px;font-weight:700}.row:nth-child(-n+3) .rk b{color:var(--acc)}
.rk small{display:block;font-size:10px;line-height:1.25;color:var(--mut);white-space:nowrap}
.rk small:first-of-type{margin-top:3px}
.mv{font-size:12px;font-weight:600;text-align:center;color:var(--mut)}.mv.up{color:var(--up)}.mv.dn{color:var(--dn)}.mv.new{color:var(--acc)}
.row>div{min-width:0}
.art{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--line);display:block}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t a{color:inherit;text-decoration:none}.t a:hover{text-decoration:underline}
.a{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{color:var(--mut);font-size:11px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{text-align:right;font-weight:700;color:var(--up)}.g small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.sec{font-size:15px;font-weight:700;margin:26px 0 4px}.sec small{color:var(--mut);font-weight:400}
.letter{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--acc);margin:14px 2px 6px}
.row.mini{grid-template-columns:40px minmax(0,1fr) auto;padding:9px 12px}.row.mini .art{width:40px;height:40px}.row.mini .g{color:var(--fg);font-weight:600}.row.mini .g small{color:var(--up)}
.empty{padding:30px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px}
</style></head>
<body><main>
<h1>Foundry <span>#50</span></h1>
<div class="nav"><a href="../">Songs</a> · <b>Albums</b></div>
<div class="sub" id="sub">Loading…</div>
<div id="chart"></div>
</main>
<script>
/* The file this page loads. The daily job saves each new snapshot under this exact name. */
const SNAPSHOT_URL = 'https://tylerviguessso.github.io/charts/albums/snapshot.json';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const LA = {timeZone:'America/Los_Angeles', dateStyle:'medium', timeStyle:'short'};

const ALPHA = new Intl.Collator('en', {sensitivity: 'base', ignorePunctuation: true, numeric: true});
const letterOf = t => { const k = (t.normalize('NFD').replace(/[^A-Za-z0-9]/g, '')[0] || '#').toUpperCase(); return /[A-Z]/.test(k) ? k : '#'; };
const nameOf = a => /^https:\/\/suno\.com\//.test(a.url || '')
  ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a>' : esc(a.title);

/* "A", "A & B", "A, B & C" */
const joinNames = l => l.length < 3 ? l.join(' & ') : l.slice(0, -1).join(', ') + ' & ' + l[l.length - 1];
const artistsOf = a => {
  if (a.various) return 'Various Artists';
  let s = joinNames(a.artists || []);
  if ((a.feat || []).length) s += (s ? ' ' : '') + '(feat. ' + joinNames(a.feat) + ')';
  return s;
};
const TYPE = {album: 'Album', ep: 'EP', compilation: 'Compilation', playlist: 'Playlist', single: 'Single'};
const metaOf = a => (TYPE[a.type] || 'Album') + (a.n ? ' · ' + a.n + (a.n === 1 ? ' track' : ' tracks') : '');

const thumb = u => u + (u.includes('?') ? '&' : '?') + 'width=100';
const art = a => /^https:\/\//.test(a.img || '')
  ? `<img class="art" loading="lazy" decoding="async" alt="" src="${esc(thumb(a.img))}" data-o="${esc(a.img)}" onerror="if(!this.dataset.r){this.dataset.r=1;this.src=this.dataset.o}else{this.style.visibility='hidden'}">`
  : '<div class="art"></div>';

/* position number, with its all-time peak and days on the chart in small text underneath */
const rankCell = a => {
  let h = '<div class="rk"><b>' + a.rank + '</b>';
  if (a.days > 0 && a.peak != null) {
    h += '<small title="Highest position reached">Peak ' + a.peak + '</small>' +
         '<small title="Days on the chart">' + a.days + (a.days === 1 ? ' day' : ' days') + '</small>';
  }
  return h + '</div>';
};

fetch(SNAPSHOT_URL + '?t=' + Date.now(), {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    const size = d.chartSize || 50;
    const all = (d.albums || []).slice().sort((a,b) => a.rank - b.rank);
    const top = all.slice(0, size);
    const rest = all.slice(size).sort((a,b) => ALPHA.compare(a.title, b.title));
    let sub = 'Plays gained by each album’s tracks since the last snapshot · updated ' + new Date(d.time).toLocaleString('en-US', LA) + ' (LA time)';
    if (d.prevTime) {
      const h = Math.round((new Date(d.time) - new Date(d.prevTime)) / 36e5);
      sub += ' · compared with ' + h + ' hours earlier';
    } else sub += ' · first snapshot, so gains, peaks and days start with the next update';
    $('sub').textContent = sub;
    if (!top.length) { $('chart').innerHTML = '<div class="empty">The snapshot has no albums yet.</div>'; return; }
    let html = top.map(a => {
      let mv = '<div class="mv">–</div>';
      if (a.isNew) mv = '<div class="mv new">NEW</div>';
      else if (a.prevRank != null && a.prevRank > a.rank) mv = '<div class="mv up">▲' + (a.prevRank - a.rank) + '</div>';
      else if (a.prevRank != null && a.prevRank < a.rank) mv = '<div class="mv dn">▼' + (a.rank - a.prevRank) + '</div>';
      return '<div class="row">' + rankCell(a) + mv + art(a) +
        '<div><div class="t">' + nameOf(a) + '</div><div class="a">' + esc(artistsOf(a)) + '</div><div class="m">' + esc(metaOf(a)) + '</div></div>' +
        '<div class="g">+' + fmt(a.gain) + '<small>' + (a.approx ? '~' : '') + fmt(a.plays) + ' total</small></div></div>';
    }).join('');
    if (rest.length) {
      html += '<div class="sec">All other albums <small>· ' + rest.length + ' ' + (rest.length === 1 ? 'album' : 'albums') + ', A–Z</small></div>';
      let cur = '';
      rest.forEach(a => {
        const L = letterOf(a.title);
        if (L !== cur) { cur = L; html += '<div class="letter">' + L + '</div>'; }
        html += '<div class="row mini">' + art(a) + '<div><div class="t">' + nameOf(a) + '</div><div class="a">' + esc(artistsOf(a)) + '</div><div class="m">' + esc(metaOf(a)) + '</div></div>' +
          '<div class="g">' + (a.approx ? '~' : '') + fmt(a.plays) + (a.gain > 0 ? '<small>+' + fmt(a.gain) + '</small>' : '') + '</div></div>';
      });
    }
    $('chart').innerHTML = html;
  })
  .catch(() => {
    $('sub').textContent = '';
    $('chart').innerHTML = '<div class="empty">Couldn’t load ' + esc(SNAPSHOT_URL) + '. Check that it’s uploaded to that address.</div>';
  });
</script></body></html>
