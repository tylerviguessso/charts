<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suno Top 50</title>
<style>
:root{--bg:#faf8f5;--fg:#1c1a17;--mut:#7a746b;--card:#fff;--line:#e7e2da;--acc:#e5391f;--up:#1a8f4c;--dn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14130f;--fg:#f2efe9;--mut:#9a948a;--card:#1d1b17;--line:#2e2b25;--acc:#ff6a4d;--up:#4cc784;--dn:#ff9a62}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14130f;--fg:#f2efe9;--mut:#9a948a;--card:#1d1b17;--line:#2e2b25;--acc:#ff6a4d;--up:#4cc784;--dn:#ff9a62}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin:4px 0 18px}
.row{display:grid;grid-template-columns:34px 44px 1fr auto;gap:10px;align-items:center;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.rk{font-size:20px;font-weight:700;text-align:center}.row:nth-child(-n+3) .rk{color:var(--acc)}
.mv{font-size:12px;font-weight:600;text-align:center;color:var(--mut)}.mv.up{color:var(--up)}.mv.dn{color:var(--dn)}.mv.new{color:var(--acc)}
.row>div:nth-child(3){min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t a{color:inherit;text-decoration:none}.t a:hover{text-decoration:underline}
.a{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{text-align:right;font-weight:700;color:var(--up)}.g small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px}
</style></head>
<body><main>
<h1>Suno <span>Top 50</span></h1>
<div class="sub" id="sub">Loading…</div>
<div id="chart"></div>
</main>
<script>
/* The file this page loads. Upload each new snapshot under this exact name. */
const SNAPSHOT_URL = 'https://tylerviguessso.github.io/charts/snapshot.json';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const LA = {timeZone:'America/Los_Angeles', dateStyle:'medium', timeStyle:'short'};

fetch(SNAPSHOT_URL + '?t=' + Date.now(), {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    const songs = (d.songs || []).slice().sort((a,b) => a.rank - b.rank).slice(0, 50);
    let sub = 'Plays gained since the last snapshot · updated ' + new Date(d.time).toLocaleString('en-US', LA) + ' (LA time)';
    if (d.prevTime) {
      const h = Math.round((new Date(d.time) - new Date(d.prevTime)) / 36e5);
      sub += ' · compared with ' + h + ' hours earlier';
    }
    $('sub').textContent = sub;
    if (!songs.length) { $('chart').innerHTML = '<div class="empty">The snapshot has no songs yet.</div>'; return; }
    $('chart').innerHTML = songs.map(s => {
      let mv = '<div class="mv">–</div>';
      if (s.isNew) mv = '<div class="mv new">NEW</div>';
      else if (s.prevRank != null && s.prevRank > s.rank) mv = '<div class="mv up">▲' + (s.prevRank - s.rank) + '</div>';
      else if (s.prevRank != null && s.prevRank < s.rank) mv = '<div class="mv dn">▼' + (s.rank - s.prevRank) + '</div>';
      return '<div class="row"><div class="rk">' + s.rank + '</div>' + mv +
        '<div><div class="t">' + (/^[0-9a-f-]{36}$/.test(s.id) ? '<a href="https://suno.com/song/' + s.id + '" target="_blank" rel="noopener">' + esc(s.title) + '</a>' : esc(s.title)) + '</div>' +
        '<div class="a">' + esc(s.artist) + '</div></div>' +
        '<div class="g">+' + fmt(s.gain) + '<small>' + (s.approx ? '~' : '') + fmt(s.plays) + ' total</small></div></div>';
    }).join('');
  })
  .catch(() => {
    $('sub').textContent = '';
    $('chart').innerHTML = '<div class="empty">Couldn’t load ' + esc(SNAPSHOT_URL) + '. Check that it’s uploaded to that address.</div>';
  });
</script></body></html>
