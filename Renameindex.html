<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suno Albums · Add</title>
<style>
:root{--bg:#faf8f5;--fg:#1c1a17;--mut:#7a746b;--card:#fff;--line:#e7e2da;--acc:#e5391f;--ok:#1a8f4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14130f;--fg:#f2efe9;--mut:#9a948a;--card:#1d1b17;--line:#2e2b25;--acc:#ff6a4d;--ok:#4cc784}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}label:first-child{margin-top:0}
label small{font-weight:400;color:var(--mut)}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chips input{flex:1;min-width:140px;border:0;padding:4px;background:none}.chips input:focus{outline:0}
.chips:focus-within{outline:2px solid var(--acc);outline-offset:-1px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{margin:0;padding:0 6px;background:none;color:var(--mut);font-size:16px;line-height:1.2}
button{padding:9px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:none;color:var(--mut);border:1px solid var(--line);padding:6px 11px;font-size:13px}
.hint{color:var(--mut);font-size:12.5px;margin:4px 0 0}
#msg{margin-top:10px;font-size:13px}#msg.ok{color:var(--ok)}#msg.err{color:var(--acc)}
.empty{padding:22px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row>div{flex:1;min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t a{color:inherit;text-decoration:none}.t a:hover{text-decoration:underline}
.a{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);border:1px solid var(--acc);border-radius:5px;padding:1px 6px}
</style></head>
<body><main>
<h1>Add an <span>album</span></h1>
<div class="sub">Add an album, EP or compilation to the album chart.</div>

<div class="card">
  <label for="type">Type</label>
  <select id="type"><option>Album</option><option>EPs</option><option>Compilations</option><option>Tributes</option></select>
  <label for="title">Title <small>(optional)</small></label>
  <input id="title" type="text" maxlength="150" autocomplete="off">
  <label>Main artists <small>(optional)</small></label>
  <div class="chips" id="main"><input type="text" maxlength="80" aria-label="Main artist"></div>
  <label>Featured artists <small>(optional)</small></label>
  <div class="chips" id="feat"><input type="text" maxlength="80" aria-label="Featured artist"></div>
  <p class="hint">Press Enter after each artist to add them. For a various-artists release, add “Various Artists”.</p>
  <label for="url">Link</label>
  <input id="url" type="text" inputmode="url" placeholder="https://suno.com/playlist/…" autocomplete="off">
  <div style="margin-top:14px"><button id="go">Add album</button></div>
  <div id="msg" role="status"></div>
</div>

<div class="card"><b id="count">Albums in store</b><div id="list"></div></div>

<div class="card"><b>Export for the live files</b>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button id="newBtn">Download new</button><button class="ghost" id="allBtn" style="font-size:14px;padding:9px 16px">Download all</button></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s).replace(/[|\r\n\t]+/g,' ').replace(/\s+/g,' ').trim();
const KEY='suno-album-list-v1';
let rows=[];
try{rows=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){rows=[]}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}};

/* chip inputs */
function chipField(el){
  const inp=el.querySelector('input'),vals=[];
  const draw=()=>{el.querySelectorAll('.chip').forEach(c=>c.remove());
    vals.forEach((v,i)=>{const c=document.createElement('span');c.className='chip';c.textContent=v;
      const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','Remove '+v);
      b.onclick=()=>{vals.splice(i,1);draw()};c.appendChild(b);el.insertBefore(c,inp)})};
  const add=()=>{const v=clean(inp.value);if(v&&!vals.some(x=>x.toLowerCase()===v.toLowerCase()))vals.push(v);inp.value='';draw()};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}else if(e.key==='Backspace'&&!inp.value&&vals.length){vals.pop();draw()}});
  inp.addEventListener('blur',add);
  el.addEventListener('click',()=>inp.focus());
  return{get:()=>{add();return vals.slice()},clear:()=>{vals.length=0;inp.value='';draw()}};
}
const main=chipField($('main')),feat=chipField($('feat'));

function normUrl(u){
  u=u.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;
  let x;try{x=new URL(u)}catch(e){return null}
  if(!/^https?:$/.test(x.protocol)||!x.hostname.includes('.'))return null;
  x.hash='';return x.origin.toLowerCase()+x.pathname.replace(/\/+$/,'')+x.search;
}
function say(t,k){const m=$('msg');m.textContent=t;m.className=k||''}

/* list */
function render(){
  $('count').textContent='Albums in store';
  $('newBtn').disabled=!rows.some(r=>!r.exported);$('allBtn').disabled=!rows.length;
  $('list').innerHTML=rows.length?rows.slice().reverse().map(r=>
    '<div class="row"><span class="tag">'+esc(r.type==='Albums'?'Album':r.type)+'</span><div><div class="t"><a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">'+esc(r.title||r.url)+'</a></div><div class="a">'
    +esc((r.main||[]).join(', '))+((r.feat||[]).length?' · feat. '+esc(r.feat.join(', ')):'')+'</div></div>'
    +'<button class="ghost" data-del="'+esc(r.id)+'">Remove</button></div>').join('')
    :'<div class="empty" style="margin-top:10px">No albums yet. Add the first one above.</div>';
}
function add(){
  const title=clean($('title').value),m=main.get(),f=feat.get(),url=normUrl($('url').value);
  if(!url)return say('That link doesn’t look valid.','err');
  if(rows.some(r=>r.url===url))return say('That link has already been added.','err');
  rows.push({id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:$('type').value,title,main:m,feat:f,url,exported:false});
  persist();
  $('title').value='';$('url').value='';main.clear();feat.clear();$('type').selectedIndex=0;
  say('Album added.','ok');render();
}
$('go').onclick=add;
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-del]');if(!x)return;
  if(x.dataset.sure!=='1'){x.dataset.sure='1';x.textContent='Sure? Click again';setTimeout(()=>{x.dataset.sure='';x.textContent='Remove'},4000);return}
  rows=rows.filter(r=>r.id!==x.dataset.del);persist();render();
});

/* export: zip with albums.txt + playlists.txt (no libraries) */
function lineFor(r){
  const p=[r.url,String(r.type||'').toLowerCase().replace(/s$/,'')];
  if((r.main||[]).length)p.push('artist='+r.main.join(', '));
  if((r.feat||[]).length)p.push('feat='+r.feat.join(', '));
  if(r.title)p.push('title='+r.title);
  return p.join(' | ');
}
function crc32(b){
  let t=crc32.t;
  if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}
  let r=-1;for(let i=0;i<b.length;i++)r=t[(r^b[i])&255]^(r>>>8);return(r^-1)>>>0;
}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of files){
    const nm=enc.encode(f.name),d=enc.encode(f.text),crc=crc32(d),sz=d.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+sz;
  }
  const cdSize=cen.reduce((a,p)=>a+p.length,0);
  parts.push(...cen,new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]));
  return new Blob(parts,{type:'application/zip'});
}
function exportZip(all){
  const set=all?rows:rows.filter(r=>!r.exported);
  if(!set.length)return;
  const blob=makeZip([
    {name:'albums.txt',text:set.map(lineFor).join('\n')+'\n'},
    {name:'playlists.txt',text:set.map(r=>r.url).join('\n')+'\n'}
  ]);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=all?'chart-files-all.zip':'chart-files-new.zip';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  if(!all){set.forEach(r=>r.exported=true);persist();render()}
}
$('newBtn').onclick=()=>exportZip(false);
$('allBtn').onclick=()=>exportZip(true);
render();
</script></body></html>
